name: generate-animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

concurrency:
  group: snake-animation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate contribution snake & Pac-Man
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      SNAKE_COLOR: "%23d4af37"
      GRID_DOTS: "%230b0716,%2315132e,%23221f4e,%236d53c8,%23d4af37"
    steps:
      # Runs first: the snake step below runs in Docker as root, and a
      # root-owned dist/ would stop this (non-root) action writing to it.
      - name: Let Pac-Man loose on the same grid
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Draw the snake from latest contributions
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=${{ env.SNAKE_COLOR }}&color_dots=${{ env.GRID_DOTS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage snake as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snake-svg
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy snake to output branch
    runs-on: ubuntu-latest
    needs: generate
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Fetch snake artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snake-svg
          path: dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}