<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="50" viewBox="0 0 1000 50" role="img" aria-label="Rotating taglines">
<style>@font-face{font-family:PX;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flicker 5s infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.86}49%{opacity:1}82%{opacity:.93}83%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fbf3d9"/><stop offset=".55" stop-color="#ecd28c"/><stop offset="1" stop-color="#c99842"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf3d9"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#b48a3a"/></linearGradient>
<linearGradient id="trim" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ecd28c"/><stop offset=".5" stop-color="#b48a3a"/><stop offset="1" stop-color="#ecd28c"/></linearGradient>
<radialGradient id="screen" cx=".5" cy=".45" r=".75">
  <stop offset="0" stop-color="#1b1338"/><stop offset=".7" stop-color="#120c26"/><stop offset="1" stop-color="#05030b"/></radialGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1.6" fill="#000" opacity=".32"/></pattern>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ecd28c"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="grid" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 0h3v3h-3z M0 0h2v2h-2z" fill="#07050f" fill-rule="evenodd" opacity=".7"/></pattern><clipPath id="tc"><rect x="6" y="6" width="988" height="38" rx="10"/></clipPath></defs>
<rect x="2" y="2" width="996" height="46" rx="12" fill="#0b0716" stroke="url(#trim)" stroke-width="1.5"/>
<g clip-path="url(#tc)" filter="url(#softglow)"><g><text x="0" y="32" font-family="PX,'Courier New',monospace" font-size="14" font-weight="400" fill="url(#tg)" text-anchor="start" >SECURE THE STACK · SHIP THE VISION ★ FULL-STACK · CLOUD · CYBERSECURITY ★ CTFS · HACKATHONS · COMMUNITIES ★ BASED IN MAHDIA · BUILDING GLOBALLY ★ </text><text x="2044" y="32" font-family="PX,'Courier New',monospace" font-size="14" font-weight="400" fill="url(#tg)" text-anchor="start" >SECURE THE STACK · SHIP THE VISION ★ FULL-STACK · CLOUD · CYBERSECURITY ★ CTFS · HACKATHONS · COMMUNITIES ★ BASED IN MAHDIA · BUILDING GLOBALLY ★ </text><animateTransform attributeName="transform" type="translate" from="0,0" to="-2044,0" dur="34s" repeatCount="indefinite"/></g></g>
<rect x="6" y="6" width="988" height="38" rx="10" fill="url(#grid)"/>
</svg>
