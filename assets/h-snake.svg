<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="Contribution Arcade">
<style>@font-face{font-family:PX;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:PF;src:url(data:font/woff2;base64,) format('woff2');}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flicker 5s infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.86}49%{opacity:1}82%{opacity:.93}83%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fbf3d9"/><stop offset=".55" stop-color="#ecd28c"/><stop offset="1" stop-color="#c99842"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf3d9"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#b48a3a"/></linearGradient>
<linearGradient id="trim" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ecd28c"/><stop offset=".5" stop-color="#b48a3a"/><stop offset="1" stop-color="#ecd28c"/></linearGradient>
<radialGradient id="screen" cx=".5" cy=".45" r=".75">
  <stop offset="0" stop-color="#1b1338"/><stop offset=".7" stop-color="#120c26"/><stop offset="1" stop-color="#05030b"/></radialGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1.6" fill="#000" opacity=".32"/></pattern>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset="1" stop-color="#d4af37" stop-opacity=".7"/></linearGradient><linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4af37" stop-opacity=".7"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient></defs>
<line x1="40" y1="52" x2="276.0" y2="52" stroke="url(#fadeL)"/><line x1="724.0" y1="52" x2="960" y2="52" stroke="url(#fadeR)"/>
<path d="M302.0 8h396l12 12v56l-12 12h-396l-12 -12v-56z" fill="#120c26" stroke="url(#trim)" stroke-width="1.6"/>
<path d="M302.0 8h396l12 12v56l-12 12h-396l-12 -12v-56z" fill="url(#scan)"/>
<text x="500.0" y="34" font-family="PX,'Courier New',monospace" font-size="10" fill="#a78bfa" text-anchor="middle" letter-spacing="1">STAGE 06 · BONUS ROUND</text>
<text x="500.0" y="70" font-family="PF,'Playfair Display',Georgia,serif" font-size="30" font-weight="700" fill="url(#gold)" text-anchor="middle" filter="url(#softglow)">Contribution Arcade</text>
<g class="blink"><path d="M316.0 54 l10 6 l-10 6z" fill="#d4af37"/><path d="M684.0 54 l-10 6 l10 6z" fill="#d4af37"/></g>
</svg>
