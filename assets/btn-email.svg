<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-label="Email">
<style>@font-face{font-family:PX;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flicker 5s infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.86}49%{opacity:1}82%{opacity:.93}83%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fbf3d9"/><stop offset=".55" stop-color="#ecd28c"/><stop offset="1" stop-color="#c99842"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf3d9"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#b48a3a"/></linearGradient>
<linearGradient id="trim" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ecd28c"/><stop offset=".5" stop-color="#b48a3a"/><stop offset="1" stop-color="#ecd28c"/></linearGradient>
<radialGradient id="screen" cx=".5" cy=".45" r=".75">
  <stop offset="0" stop-color="#1b1338"/><stop offset=".7" stop-color="#120c26"/><stop offset="1" stop-color="#05030b"/></radialGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1.6" fill="#000" opacity=".32"/></pattern>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="bc"><rect x="3" y="3" width="234" height="58" rx="12"/></clipPath></defs>
<rect x="2" y="5" width="236" height="58" rx="13" fill="#05030b"/>
<rect x="2" y="2" width="236" height="56" rx="13" fill="#120c26" stroke="#d4af37" stroke-width="1.5"/>
<rect x="2" y="2" width="236" height="56" rx="13" fill="url(#scan)" opacity=".6"/>
<path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#d4af37" transform="translate(26 18) scale(1)"/>
<text x="64" y="36" font-family="PX,'Courier New',monospace" font-size="12" font-weight="400" fill="#fbf3d9" text-anchor="start" >EMAIL</text>
<rect x="-80" y="0" width="60" height="64" fill="url(#shine)" clip-path="url(#bc)"><animate attributeName="x" values="-80;260;260" keyTimes="0;.3;1" dur="5s" begin="1.9s" repeatCount="indefinite"/></rect>
